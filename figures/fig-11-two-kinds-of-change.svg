<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348">
<title>两类改动</title>
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7" fill="none" stroke="rgba(60,60,67,.30)" stroke-width="1.4"/></marker></defs>
<rect width="760" height="348" fill="#FFFFFF"/>
<g font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'><rect x="24" y="30" width="340" height="40" rx="10" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="194" y="56" font-size="15" fill="#00A69E" text-anchor="middle">同类改动</text><text x="24" y="84" font-size="13" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>再加一个已有维度里的东西</text><rect x="24" y="106" width="340" height="36" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,.20)" stroke-width="1.5"/><text x="33" y="126" font-size="13.5" fill="#1D1D1F" text-anchor="start">加第五种语法</text><rect x="24" y="150" width="340" height="36" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,.20)" stroke-width="1.5"/><text x="33" y="170" font-size="13.5" fill="#1D1D1F" text-anchor="start">加第四个导出格式</text><rect x="24" y="194" width="340" height="36" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,.20)" stroke-width="1.5"/><text x="33" y="214" font-size="13.5" fill="#1D1D1F" text-anchor="start">加第三个存储实现</text><rect x="24" y="246" width="340" height="40" rx="10" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="194" y="271" font-size="13.5" fill="#00A69E" text-anchor="middle">应该只改一两个文件</text><text x="24" y="302" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>改到四个以上 → 那个维度缺一层抽象</text><rect x="420" y="30" width="316" height="40" rx="10" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="578" y="56" font-size="15" fill="#1D1D1F" text-anchor="middle">新维度</text><text x="420" y="84" font-size="13" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>加一个以前没有的概念</text><rect x="420" y="106" width="316" height="36" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,.20)" stroke-width="1.5"/><text x="429" y="126" font-size="13.5" fill="#1D1D1F" text-anchor="start">加标签</text><rect x="420" y="150" width="316" height="36" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,.20)" stroke-width="1.5"/><text x="429" y="170" font-size="13.5" fill="#1D1D1F" text-anchor="start">加搜索</text><rect x="420" y="194" width="316" height="36" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,.20)" stroke-width="1.5"/><text x="429" y="214" font-size="13.5" fill="#1D1D1F" text-anchor="start">加图片</text><rect x="420" y="246" width="316" height="40" rx="10" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="578" y="271" font-size="13.5" fill="#1D1D1F" text-anchor="middle">穿过所有层是正常的</text><text x="420" y="302" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>改六个文件也不用慌</text></g>
</svg>