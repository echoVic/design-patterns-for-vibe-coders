<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432">
<title>抽象的收益曲线</title>
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7" fill="none" stroke="rgba(60,60,67,.30)" stroke-width="1.4"/></marker></defs>
<rect width="760" height="432" fill="#FFFFFF"/>
<g font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'><text x="60" y="30" font-size="13" fill="rgba(60,60,67,.30)" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">加一个功能的成本</text><text x="60" y="52" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">低 → 高</text><path d="M60,70 L60,330 L700,330" stroke="rgba(60,60,67,.20)" stroke-width="1.5" fill="none"/><path d="M80,310 C 280,314 430,240 660,180" stroke="#00A69E" stroke-width="2.2" fill="none"/><path d="M80,210 C 300,214 450,218 660,222" stroke="#FF3B30" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/><path d="M80,262 C 300,260 500,258 660,256" stroke="#1D1D1F" stroke-width="2.2" fill="none"/><text x="668" y="172" font-size="13" fill="#00A69E" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">v0.1</text><text x="668" y="214" font-size="13" fill="#FF3B30" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">v0.2</text><text x="668" y="248" font-size="13" fill="#1D1D1F" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">v1.1</text><text x="380" y="356" font-size="12.5" fill="rgba(60,60,67,.30)" text-anchor="middle" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">功能数量 →</text><text x="80" y="386" font-size="12.5" fill="#00A69E" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">起点低，涨得快</text><text x="310" y="386" font-size="12.5" fill="#FF3B30" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">起点就高，而且不降</text><text x="520" y="386" font-size="12.5" fill="#1D1D1F" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">起点中等，最平</text></g>
</svg>