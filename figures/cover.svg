<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<title>给 Vibe Coder 的设计模式</title>
<rect width="1200" height="1600" fill="#FFFFFF"/>
<g font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'><path d="M140,880 L140,1240 L1060,1240" stroke="rgba(60,60,67,.14)" stroke-width="2" fill="none"/><path d="M170,1200 C 420,1206 700,1100 1000,1026" stroke="#00A69E" stroke-width="3.5" fill="none"/><path d="M170,990 C 450,994 700,1000 1000,1006" stroke="#FF3B30" stroke-width="3.5" fill="none" stroke-dasharray="10 7"/><path d="M170,1090 C 450,1086 750,1082 1000,1078" stroke="#1D1D1F" stroke-width="3.5" fill="none"/><text x="1010" y="1020" font-size="20" font-weight="400" fill="#00A69E" text-anchor="start" letter-spacing="normal">v0.1</text><text x="1010" y="1000" font-size="20" font-weight="400" fill="#FF3B30" text-anchor="start" letter-spacing="normal">v0.2</text><text x="1010" y="1072" font-size="20" font-weight="400" fill="#1D1D1F" text-anchor="start" letter-spacing="normal">v1.1</text><text x="140" y="300" font-size="62" font-weight="600" fill="#1D1D1F" text-anchor="start" letter-spacing="-1.5">给 Vibe Coder 的</text><text x="140" y="390" font-size="92" font-weight="700" fill="#1D1D1F" text-anchor="start" letter-spacing="-3">设计模式</text><path d="M140,440 L300,440" stroke="#00A69E" stroke-width="4"/><text x="140" y="520" font-size="30" font-weight="400" fill="rgba(60,60,67,.62)" text-anchor="start" letter-spacing="normal">AI 会写代码，</text><text x="140" y="566" font-size="30" font-weight="400" fill="rgba(60,60,67,.62)" text-anchor="start" letter-spacing="normal">但不会判断结构值不值。</text><text x="140" y="680" font-size="26" font-weight="400" fill="rgba(60,60,67,.28)" text-anchor="start" letter-spacing="1">认出它 · 判断它 · 拆掉它</text><text x="140" y="1430" font-size="32" font-weight="400" fill="#1D1D1F" text-anchor="start" letter-spacing="normal">青雲老哥</text><text x="140" y="1480" font-size="24" font-weight="400" fill="rgba(60,60,67,.28)" text-anchor="start" letter-spacing="normal">17 章 + 2 附录</text><text x="140" y="1520" font-size="24" font-weight="400" fill="rgba(60,60,67,.28)" text-anchor="start" letter-spacing="normal">一个案例从 44 行长到 165 行，再被修剪</text></g>
</svg>