<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288">
<title>六个 if 与六条规则</title>
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7" fill="none" stroke="rgba(60,60,67,.30)" stroke-width="1.4"/></marker></defs>
<rect width="760" height="288" fill="#FFFFFF"/>
<g font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'><text x="24" y="30" font-size="13.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>分支版：顺序只存在于代码的行序里</text><rect x="24" y="44" width="300" height="28" rx="6" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="30" y="60" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>if (options.inlineCode)</text><rect x="24" y="78" width="300" height="28" rx="6" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="30" y="94" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>if (options.bold)</text><rect x="24" y="112" width="300" height="28" rx="6" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="30" y="128" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>if (options.strike)</text><rect x="24" y="146" width="300" height="28" rx="6" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="30" y="162" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>if (options.link)</text><rect x="24" y="180" width="300" height="28" rx="6" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="30" y="196" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>if (options.quote)</text><rect x="24" y="214" width="300" height="28" rx="6" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="30" y="230" font-size="12.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>if (options.list)</text><text x="24" y="254" font-size="12.5" fill="#FF3B30" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>加一条：要在中间找个位置插进去</text><text x="420" y="30" font-size="13.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>数组版：顺序就是数组顺序</text><rect x="420" y="44" width="200" height="28" rx="6" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="426" y="60" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>inlineCode</text><text x="632" y="63" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>第 1 个执行</text><rect x="420" y="78" width="200" height="28" rx="6" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="426" y="94" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>bold</text><text x="632" y="97" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>第 2 个</text><rect x="420" y="112" width="200" height="28" rx="6" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="426" y="128" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>strike</text><text x="632" y="131" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>第 3 个</text><rect x="420" y="146" width="200" height="28" rx="6" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="426" y="162" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>link</text><text x="632" y="165" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>第 4 个</text><rect x="420" y="180" width="200" height="28" rx="6" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="426" y="196" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>quote</text><text x="632" y="199" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>第 5 个</text><rect x="420" y="214" width="200" height="28" rx="6" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="426" y="230" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='"SF Mono",ui-monospace,Menlo,monospace'>list</text><text x="632" y="233" font-size="12" fill="rgba(60,60,67,.30)" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>第 6 个</text><text x="420" y="254" font-size="12.5" fill="#00A69E" text-anchor="start" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>加一条：加一个数组元素</text></g>
</svg>