<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
<title>四层包装</title>
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7" fill="none" stroke="rgba(60,60,67,.30)" stroke-width="1.4"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<g font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'><text x="24" y="30" font-size="13.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">嵌套调用：顺序藏在括号里</text><rect x="24" y="44" width="700" height="52" rx="10" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="374" y="69" font-size="13.5" fill="#1D1D1F" text-anchor="middle" font-family=""SF Mono",ui-monospace,Menlo,monospace">withRetry( withLog( withUndo( withDebounce( rawSave, 400 ) ) ) )</text><text x="24" y="112" font-size="12.5" fill="#FF3B30" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">从里往外读才知道顺序，而且改一层要动整行</text><text x="24" y="156" font-size="13.5" fill="rgba(60,60,67,.60)" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">数组：顺序是数据</text><rect x="24" y="170" width="300" height="34" rx="8" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="32" y="188" font-size="12.5" fill="#00A69E" text-anchor="start" font-family=""SF Mono",ui-monospace,Menlo,monospace">withDebounce(.., 400)</text><text x="344" y="192" font-size="12.5" fill="#00A69E" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">第 1 个执行</text><rect x="24" y="212" width="300" height="34" rx="8" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="32" y="230" font-size="12.5" fill="#1D1D1F" text-anchor="start" font-family=""SF Mono",ui-monospace,Menlo,monospace">withUndo(..)</text><text x="344" y="234" font-size="12.5" fill="#1D1D1F" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">第 2 个</text><rect x="24" y="254" width="300" height="34" rx="8" fill="rgba(255,59,48,.08)" stroke="none" stroke-width="1.5"/><text x="32" y="272" font-size="12.5" fill="#FF3B30" text-anchor="start" font-family=""SF Mono",ui-monospace,Menlo,monospace">withLog(..)</text><text x="344" y="276" font-size="12.5" fill="#FF3B30" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">第 3 个 · 摘掉不影响行为</text><rect x="24" y="296" width="300" height="34" rx="8" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="32" y="314" font-size="12.5" fill="#1D1D1F" text-anchor="start" font-family=""SF Mono",ui-monospace,Menlo,monospace">withRetry(.., 1)</text><text x="344" y="318" font-size="12.5" fill="#1D1D1F" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">第 4 个</text><text x="24" y="346" font-size="12.5" fill="#00A69E" text-anchor="start" font-family="-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif">顺序可以单独断言，每一层可以单独讨论</text></g>
</svg>