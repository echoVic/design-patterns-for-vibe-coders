<svg xmlns="http://www.w3.org/2000/svg" width="760" height="538" viewBox="0 0 760 538">
<title>四步判断流程</title>
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7" fill="none" stroke="rgba(60,60,67,.30)" stroke-width="1.4"/></marker></defs>
<rect width="760" height="538" fill="#FFFFFF"/>
<g font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'><rect x="160" y="24" width="470" height="71" rx="10" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="173" y="49" font-size="15" fill="#1D1D1F" text-anchor="start">先证明它贵</text><text x="173" y="71" font-size="15" fill="rgba(60,60,67,.60)" text-anchor="start">挑一个最近真做过的改动，数它碰了几个文件</text><text x="146" y="50" font-size="13" fill="rgba(60,60,67,.30)" text-anchor="end" font-family='"SF Mono",ui-monospace,Menlo,monospace'>1</text><path d="M395,97 L395,121" stroke="rgba(60,60,67,.30)" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="160" y="129" width="470" height="71" rx="10" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="173" y="154" font-size="15" fill="#00A69E" text-anchor="start">看它服务几个消费者</text><text x="173" y="176" font-size="15" fill="rgba(60,60,67,.60)" text-anchor="start">一个，而且和实现一一对应 → 候选；两个以上 → 留</text><text x="146" y="155" font-size="13" fill="rgba(60,60,67,.30)" text-anchor="end" font-family='"SF Mono",ui-monospace,Menlo,monospace'>2</text><path d="M395,202 L395,226" stroke="rgba(60,60,67,.30)" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="160" y="234" width="470" height="71" rx="10" fill="#F5F5F7" stroke="none" stroke-width="1.5"/><text x="173" y="259" font-size="15" fill="#1D1D1F" text-anchor="start">抽出来看参数</text><text x="173" y="281" font-size="15" fill="rgba(60,60,67,.60)" text-anchor="start">参数干净 → 真重复；全是开关 → 假重复，拆回去</text><text x="146" y="260" font-size="13" fill="rgba(60,60,67,.30)" text-anchor="end" font-family='"SF Mono",ui-monospace,Menlo,monospace'>3</text><path d="M395,307 L395,331" stroke="rgba(60,60,67,.30)" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="160" y="339" width="470" height="71" rx="10" fill="rgba(0,199,190,.10)" stroke="none" stroke-width="1.5"/><text x="173" y="364" font-size="15" fill="#00A69E" text-anchor="start">列同类改动的清单</text><text x="173" y="386" font-size="15" fill="rgba(60,60,67,.60)" text-anchor="start">同类改动要改四个以上文件 → 缺一层抽象</text><text x="146" y="365" font-size="13" fill="rgba(60,60,67,.30)" text-anchor="end" font-family='"SF Mono",ui-monospace,Menlo,monospace'>4</text><path d="M395,412 L395,436" stroke="rgba(60,60,67,.30)" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="160" y="444" width="470" height="54" rx="10" fill="#1D1D1F" stroke="none" stroke-width="1.5"/><text x="395" y="471" font-size="16" fill="#FFFFFF" text-anchor="middle">把抽象放到有消费者的地方</text><text x="146" y="496" font-size="12.5" fill="rgba(60,60,67,.30)" text-anchor="end" font-family='-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif'>不是删到最少</text></g>
</svg>